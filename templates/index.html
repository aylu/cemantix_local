<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cemantix Local</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Cemantix Local</h1>
      <p>Devinez le mot du jour (prototype local).</p>

      <form id="guess-form" class="card">
        <label>
          Pseudo (optionnel)
          <input type="text" id="pseudo" placeholder="ex: alice" />
        </label>
        <label>
          Votre proposition
          <input type="text" id="guess" placeholder="Entrez un mot" required />
        </label>
        <button type="submit">Tester</button>
      </form>

      <section>
        <h2>Historique de la session</h2>
        <ul id="history"></ul>
      </section>
    </main>

    <script src="/static/client.js"></script>
  </body>
</html>
